<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · BinoZoom GPS</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#000000">
<link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="40" height="40">
    <span>BinoZoom GPS</span>
  </a>
  <nav>
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="on"{% endif %}>Support</a>
    <a href="{{ '/privacy' | relative_url }}"{% if page.url contains 'privacy' %} class="on"{% endif %}>Privacy</a>
    <a href="{{ '/terms' | relative_url }}"{% if page.url contains 'terms' %} class="on"{% endif %}>Terms</a>
  </nav>
</header>
<main class="page">
{{ content }}
</main>
<footer class="bottom">
  <span>© 2026 Tigran Barseghyan</span>
  <a href="mailto:developer.barseghyan@gmail.com">developer.barseghyan@gmail.com</a>
  <a href="https://developer-barseghyan.github.io/">All apps</a>
</footer>
</body>
</html>
